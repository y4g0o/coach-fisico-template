name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover tests -v
      - name: Smoke test da CLI com os dados de exemplo
        run: |
          ./coach ficha dados/fichas/2026-11-09.md
          ./coach peso
          ./coach treino
